name: Deploy Storefront to MilesWeb

on:
  push:
    branches:
      - main
    paths:
      - "boldcave-storefront/**"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch:

concurrency:
  group: boldcave-storefront-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and build storefront
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.MILESWEB_HOST }}
          username: ${{ secrets.STOREFRONT_SSH_USER }}
          key: ${{ secrets.MILESWEB_SSH_PRIVATE_KEY }}
          port: ${{ secrets.MILESWEB_SSH_PORT }}
          command_timeout: 12m
          envs: GITHUB_TOKEN
          script: |
            set -e

            source ~/.nvm/nvm.sh
            nvm use 22.23.2

            echo "Using Node:"
            node -v

            cd ~/boldcave

            BEFORE="$(git rev-parse HEAD)"

            echo "Pulling latest code..."
            GITHUB_AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $GITHUB_AUTH" pull --ff-only origin main
            unset GITHUB_AUTH GITHUB_TOKEN

            AFTER="$(git rev-parse HEAD)"

            DEPS_CHANGED=false

            if [ "$BEFORE" != "$AFTER" ] && git diff --name-only "$BEFORE" "$AFTER" | grep -Eq '^boldcave-storefront/(package.json|package-lock.json)$'; then
              DEPS_CHANGED=true
            fi

            cd boldcave-storefront

            if [ "$DEPS_CHANGED" = true ]; then
              echo "Dependencies changed; running npm ci..."
              npm ci
            else
              echo "Dependencies unchanged; skipping npm ci."
            fi

            echo "Building storefront..."
            npm run build

            echo "Verifying production build..."

            if [ ! -f .next/BUILD_ID ]; then
              echo "ERROR: Production build verification failed."
              echo ".next/BUILD_ID was not found."
              exit 1
            fi

            echo "Production build verified successfully."
            echo "BUILD_ID:"
            cat .next/BUILD_ID

            echo "Storefront deployment build completed successfully."
            echo "MilesWeb Node app still needs Restart in mPanel."
