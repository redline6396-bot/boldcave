name: Deploy Admin to MilesWeb

on:
  push:
    branches:
      - main
    paths:
      - "boldcave-admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: boldcave-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and build admin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.MILESWEB_HOST }}
          username: ${{ secrets.ADMIN_SSH_USER }}
          key: ${{ secrets.MILESWEB_SSH_PRIVATE_KEY }}
          port: ${{ secrets.MILESWEB_SSH_PORT }}
          command_timeout: 12m
          script: |
            set -e

            source ~/.nvm/nvm.sh
            nvm use 22.23.2

            echo "Using Node:"
            node -v

            cd ~/boldcave

            BEFORE="$(git rev-parse HEAD)"

            echo "Pulling latest code..."
            git pull --ff-only origin main

            AFTER="$(git rev-parse HEAD)"

            DEPS_CHANGED=false

            if [ "$BEFORE" != "$AFTER" ] && git diff --name-only "$BEFORE" "$AFTER" | grep -Eq '^boldcave-admin/(package.json|package-lock.json)$'; then
              DEPS_CHANGED=true
            fi

            cd boldcave-admin

            if [ "$DEPS_CHANGED" = true ]; then
              echo "Dependencies changed; running npm ci..."
              npm ci
            else
              echo "Dependencies unchanged; skipping npm ci."
            fi

            echo "Building admin..."
            npm run build

            echo "Verifying production build..."

            if [ ! -f .next/BUILD_ID ]; then
              echo "ERROR: Production build verification failed."
              echo ".next/BUILD_ID was not found."
              exit 1
            fi

            echo "Production build verified successfully."
            echo "BUILD_ID:"
            cat .next/BUILD_ID

            echo "Admin deployment build completed successfully."
            echo "MilesWeb Node app still needs Restart in mPanel."