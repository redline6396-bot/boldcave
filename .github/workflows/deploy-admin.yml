name: Deploy Admin to MilesWeb

on:
  push:
    branches:
      - main
    paths:
      - "boldcave-admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: boldcave-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and build admin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.MILESWEB_HOST }}
          username: ${{ secrets.ADMIN_SSH_USER }}
          key: ${{ secrets.MILESWEB_SSH_PRIVATE_KEY }}
          port: ${{ secrets.MILESWEB_SSH_PORT }}
          command_timeout: 25m
          envs: GITHUB_TOKEN
          script: |
            set -e

            source ~/.nvm/nvm.sh
            nvm use 22.23.2

            echo "Using Node:"
            node -v

            cd ~/boldcave

            BEFORE="$(git rev-parse HEAD)"

            echo "Pulling latest code..."
            GITHUB_AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $GITHUB_AUTH" pull --ff-only origin main
            unset GITHUB_AUTH GITHUB_TOKEN

            AFTER="$(git rev-parse HEAD)"

            DEPS_CHANGED=false

            if [ "$BEFORE" != "$AFTER" ] && git diff --name-only "$BEFORE" "$AFTER" | grep -Eq '^boldcave-admin/(package.json|package-lock.json)$'; then
              DEPS_CHANGED=true
            fi

            cd boldcave-admin

            if [ "$DEPS_CHANGED" = true ]; then
              echo "Dependencies changed; running npm ci..."
              npm ci
            else
              echo "Dependencies unchanged; skipping npm ci."
            fi

            BUILD_SUCCEEDED=false

            for BUILD_ATTEMPT in 1 2 3; do
              echo "Building admin (attempt $BUILD_ATTEMPT/3)..."

              if npm run build && [ -f .next/BUILD_ID ]; then
                echo "Admin build attempt $BUILD_ATTEMPT/3 passed."
                BUILD_SUCCEEDED=true
                break
              fi

              echo "Admin build attempt $BUILD_ATTEMPT/3 failed."

              if [ "$BUILD_ATTEMPT" -lt 3 ]; then
                echo "Retrying admin build..."
                sleep 2
              fi
            done

            if [ "$BUILD_SUCCEEDED" != true ]; then
              echo "ERROR: Admin build failed after 3 attempts."
              exit 1
            fi

            echo "Admin production build passed."
            echo "BUILD_ID:"
            cat .next/BUILD_ID

            mkdir -p tmp
            touch tmp/restart.txt

            echo "Admin deployment completed and Passenger restart requested."
